# /etc/nginx/sites-available/home-control.conf — LAN-only front door for the home dashboard.
# Answers on the normal web port when the server is addressed by its LAN IP (http://<server-ip>), so there's no
# extra port. Other sites on the box are unaffected: they only answer to their own host names.
# nginx also refuses anything outside the home network. install.sh fills in the @...@ values.
server {
    listen 80;
    server_name @LAN_IP@;

    # Home devices only. The router is denied first: routers that rewrite port-forwarded internet traffic make
    # it look like it comes from the router's own LAN address.
    deny @ROUTER_IP@;
    allow @LAN_NET@;
    allow 127.0.0.1;
    deny all;

    server_tokens off;
    client_max_body_size 32k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
